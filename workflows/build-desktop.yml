name: Build desktop applications

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows-x64
            runner: windows-2022
            architecture: x64
          - name: macOS-arm64
            runner: macos-14
            architecture: arm64
          - name: macOS-x64
            runner: macos-15-intel
            architecture: x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.architecture }}
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt "pyinstaller>=6.10,<7"
      - name: Build and test standalone application
        run: python build_desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: Mars-${{ matrix.name }}
          path: dist/desktop/*
          if-no-files-found: error
          retention-days: 14
